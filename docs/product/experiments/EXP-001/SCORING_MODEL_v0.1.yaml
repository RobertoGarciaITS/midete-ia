acceptance_criteria:
  - all_scored_questions_are_exactly_RDY_001_through_RDY_010
  - no_non_scored_question_changes_points
  - yes_maps_to_one_and_no_maps_to_zero
  - every_dimension_contains_exactly_two_approved_questions
  - every_dimension_range_is_zero_to_two
  - overall_range_is_zero_to_ten
  - no_weights_are_used
  - missing_answers_do_not_generate_partial_scores
  - invalid_values_do_not_generate_scores
  - priority_ties_are_preserved_and_deterministically_ordered
  - all_two_case_does_not_invent_a_priority_gap
  - all_zero_case_does_not_invent_a_relative_strength
  - total_is_described_as_indicators_present_not_percentage
  - prohibited_employment_interpretations_are_explicit
  - model_is_implementation_neutral
  - test_vectors_are_reproducible
  - artifact_remains_compatible_with_exp001_no_code_architecture

review_state:
  content_self_check: COMPLETE
  lifecycle_status: DRAFT
  acceptance_review: PENDING
  registration: PENDING
  evidence: PENDING
  dependency_advance: NOT_AUTHORIZED
